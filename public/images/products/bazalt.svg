<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="basaltTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0.2  0    0    0  0.10
        0    0.2  0    0  0.10
        0    0    0.2  0  0.10
        0    0    0    1  0" in="noise" result="coloredNoise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.3" result="light">
        <feDistantLight azimuth="70" elevation="45" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="coloredNoise" in2="light" result="stoneTex" />
    </filter>

    <linearGradient id="basaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2c2b" />
      <stop offset="50%" stop-color="#212322" />
      <stop offset="100%" stop-color="#181918" />
    </linearGradient>

    <!-- Beveled Edge Profile & Micro-vesicle Pattern -->
    <pattern id="basaltGrain" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#202221" />
      <!-- Tiny micro-pores typical of volcanic basalt -->
      <circle cx="12" cy="14" r="1.4" fill="#121312" opacity="0.85" />
      <circle cx="48" cy="18" r="1.1" fill="#121312" opacity="0.8" />
      <circle cx="28" cy="46" r="1.6" fill="#121312" opacity="0.9" />
      <circle cx="62" cy="52" r="1.2" fill="#121312" opacity="0.75" />
      <circle cx="18" cy="62" r="1.0" fill="#121312" opacity="0.8" />
      <!-- Subtle light pyroxene/plagioclase specks -->
      <circle cx="38" cy="24" r="1.2" fill="#7a7d7a" opacity="0.4" />
      <circle cx="56" cy="38" r="0.9" fill="#888c88" opacity="0.45" />
      <circle cx="15" cy="40" r="1.1" fill="#727572" opacity="0.35" />
      <circle cx="45" cy="65" r="1.0" fill="#7f827f" opacity="0.4" />
    </pattern>

    <!-- 45-degree Beveled Edge Highlight as seen on manufactured steps -->
    <linearGradient id="bevelHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e524e" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#262826" stop-opacity="0.1" />
      <stop offset="75%" stop-color="#141514" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3d403d" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Deep Charcoal / Black Basalt Matrix -->
  <rect width="1200" height="900" fill="url(#basaltGrad)" />
  <rect width="1200" height="900" fill="url(#basaltGrain)" opacity="0.9" />
  <rect width="1200" height="900" filter="url(#basaltTexture)" opacity="0.35" />
  <rect width="1200" height="900" fill="url(#bevelHighlight)" />

  <!-- Heavy Duty Sawn Chamfer Border -->
  <rect x="0" y="0" width="1200" height="900" fill="none" stroke="#383b38" stroke-width="3" opacity="0.6" />
</svg>
