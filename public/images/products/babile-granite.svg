<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="babileNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="5" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0.8  0.3  0.1  0  0.3
        0.4  0.4  0.1  0  0.15
        0.2  0.2  0.2  0  0.08
        0    0    0    1  0" in="noise" result="coloredNoise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="45" elevation="55" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="coloredNoise" in2="light" result="stoneTex" />
    </filter>

    <!-- Diagonal Geological Flow Gradient -->
    <linearGradient id="babileFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b4684a" />
      <stop offset="25%" stop-color="#c97b5a" />
      <stop offset="45%" stop-color="#995237" />
      <stop offset="65%" stop-color="#d48a68" />
      <stop offset="85%" stop-color="#a65d40" />
      <stop offset="100%" stop-color="#bf7253" />
    </linearGradient>

    <pattern id="babileSpecks" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Dark smoky quartz & biotite clusters -->
      <path d="M12,18 q4,-3 6,2 t-3,5 z M45,28 q5,-2 4,6 t-6,2 z M78,14 q3,-3 5,2 t-4,4 z M24,62 q4,-2 3,5 t-4,3 z M62,58 q6,-2 4,6 t-7,2 z M88,72 q3,-3 4,2 t-4,4 z M36,86 q4,-2 4,4 t-5,3 z" fill="#2d221c" opacity="0.8" />
      <!-- Salmon pink & peach feldspar highlights -->
      <path d="M22,38 q8,-4 12,3 t-7,9 z M58,18 q7,-3 10,4 t-8,6 z M72,48 q9,-3 11,5 t-8,8 z M14,78 q8,-3 9,5 t-7,6 z" fill="#e5987a" opacity="0.6" />
      <circle cx="28" cy="22" r="2.5" fill="#f5c2b0" opacity="0.7" />
      <circle cx="68" cy="32" r="3.2" fill="#f5c2b0" opacity="0.7" />
      <circle cx="48" cy="74" r="2.8" fill="#f5c2b0" opacity="0.7" />
      <!-- Translucent quartz nodules -->
      <circle cx="40" cy="46" r="3.5" fill="#e8dfdb" opacity="0.55" />
      <circle cx="82" cy="85" r="3.0" fill="#e8dfdb" opacity="0.5" />
    </pattern>

    <linearGradient id="warmSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Babile Terracotta Base & Geological Veining -->
  <rect width="1200" height="900" fill="url(#babileFlow)" />
  <rect width="1200" height="900" fill="url(#babileSpecks)" opacity="0.9" />
  <rect width="1200" height="900" filter="url(#babileNoise)" opacity="0.4" />
  <rect width="1200" height="900" fill="url(#warmSheen)" />

  <rect x="0" y="0" width="1200" height="900" fill="none" stroke="#7a422d" stroke-width="2" opacity="0.4" />
</svg>
