<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="grayMarbleDistort" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>

    <linearGradient id="grayBed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8c8a" />
      <stop offset="30%" stop-color="#737573" />
      <stop offset="70%" stop-color="#939693" />
      <stop offset="100%" stop-color="#676967" />
    </linearGradient>

    <!-- Broad Cloudy White Metamorphic Wave Bands (as seen in IMG_7581.png) -->
    <linearGradient id="boldWhiteVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f2f5f2" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#e2e6e2" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Cool Pewter / Slate Gray Base -->
  <rect width="1200" height="900" fill="url(#grayBed)" />

  <!-- Dramatic Horizontal & Diagonal White Calcite Metamorphic Formations -->
  <g filter="url(#grayMarbleDistort)">
    <!-- Broad primary white river vein -->
    <path d="M-80,480 Q320,380 650,440 T1280,360" fill="none" stroke="url(#boldWhiteVein)" stroke-width="85" stroke-linecap="round" />
    <!-- Secondary undulating cloudy wave -->
    <path d="M-50,220 Q280,160 700,240 T1300,180" fill="none" stroke="url(#boldWhiteVein)" stroke-width="50" stroke-linecap="round" opacity="0.85" />
    <!-- Lower wave band -->
    <path d="M-100,740 Q400,680 850,720 T1350,660" fill="none" stroke="url(#boldWhiteVein)" stroke-width="65" stroke-linecap="round" opacity="0.9" />
    <!-- Fine graphite boundary lines -->
    <path d="M-60,440 Q330,350 670,410 T1260,330" fill="none" stroke="#484a48" stroke-width="6" opacity="0.6" />
    <path d="M-60,530 Q330,430 670,490 T1260,400" fill="none" stroke="#3d3f3d" stroke-width="8" opacity="0.55" />
  </g>

  <!-- Polished Architectural Sheen -->
  <rect width="1200" height="900" fill="none" stroke="#505250" stroke-width="2" opacity="0.5" />
</svg>
