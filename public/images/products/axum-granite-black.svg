<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="blackGraniteNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0.15 0    0    0  0.08
        0    0.15 0    0  0.08
        0    0    0.15 0  0.08
        0    0    0    1  0" in="noise" result="coloredNoise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.1" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="coloredNoise" in2="light" result="stoneTex" />
    </filter>

    <pattern id="blackGraniteSpecks" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#141514" />
      <!-- Subtle microscopic reflective quartz crystals -->
      <circle cx="15" cy="22" r="1.5" fill="#ffffff" opacity="0.45" />
      <circle cx="48" cy="12" r="1.2" fill="#d2d4d2" opacity="0.5" />
      <circle cx="75" cy="38" r="1.8" fill="#ffffff" opacity="0.4" />
      <circle cx="32" cy="55" r="1.4" fill="#e8ebe8" opacity="0.45" />
      <circle cx="82" cy="74" r="1.2" fill="#d0d4d0" opacity="0.35" />
      <circle cx="20" cy="80" r="1.6" fill="#ffffff" opacity="0.4" />
      <circle cx="60" cy="85" r="1.3" fill="#ffffff" opacity="0.4" />
      <!-- Dark graphite mineral nodes -->
      <path d="M8,40 q3,-2 4,3 t-3,4 z M52,42 q2,-3 4,2 t-3,3 z M78,18 q3,-1 2,4 t-4,1 z M35,72 q3,-2 3,3 t-4,2 z" fill="#242624" opacity="0.8" />
    </pattern>

    <linearGradient id="blackSlabSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#323432" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#141514" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#0a0a0a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2a2c2a" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Black Matrix -->
  <rect width="1200" height="900" fill="#121312" />
  <rect width="1200" height="900" fill="url(#blackGraniteSpecks)" opacity="0.95" />
  <rect width="1200" height="900" filter="url(#blackGraniteNoise)" opacity="0.35" />
  <rect width="1200" height="900" fill="url(#blackSlabSheen)" />

  <!-- Natural Sawn Slab Edge -->
  <rect x="0" y="0" width="1200" height="900" fill="none" stroke="#2c2d2c" stroke-width="2" opacity="0.5" />
</svg>
