<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Realistic Granite Salt-and-Pepper Texture Filter -->
    <filter id="graniteNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="5" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        1.1  0.2  0.2  0  0.15
        0.2  1.1  0.2  0  0.15
        0.2  0.2  1.1  0  0.15
        0    0    0    1  0" in="noise" result="coloredNoise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.4" result="light">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="coloredNoise" in2="light" result="stoneTex" />
    </filter>
    
    <pattern id="quartzSpecks" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#e8e8e6" />
      <!-- Black biotite flecks -->
      <path d="M5,12 q3,-4 6,1 t-2,5 z M32,18 q4,-2 3,5 t-5,2 z M64,10 q2,-3 5,2 t-3,4 z M14,48 q3,-2 4,3 t-4,4 z M48,52 q5,-1 3,6 t-6,1 z M72,60 q4,-2 3,5 t-4,3 z M22,74 q2,-3 5,2 t-3,3 z M58,78 q3,-3 5,2 t-4,4 z" fill="#1b1d1c" opacity="0.85" />
      <!-- Dark slate grains -->
      <path d="M18,28 q2,-2 4,1 t-2,3 z M42,36 q3,-1 2,4 t-4,1 z M70,24 q2,-2 3,2 t-3,2 z M28,60 q3,-1 2,3 t-3,2 z M52,22 q2,-2 3,1 t-2,3 z M6,68 q2,-1 3,2 t-2,3 z M38,70 q2,-2 3,2 t-3,2 z" fill="#323432" opacity="0.75" />
      <!-- White quartz crystals -->
      <circle cx="12" cy="8" r="2.5" fill="#ffffff" opacity="0.9" />
      <circle cx="45" cy="14" r="3.2" fill="#ffffff" opacity="0.9" />
      <circle cx="26" cy="42" r="2.8" fill="#ffffff" opacity="0.9" />
      <circle cx="68" cy="44" r="3.5" fill="#ffffff" opacity="0.9" />
      <circle cx="16" cy="62" r="2.2" fill="#ffffff" opacity="0.9" />
      <circle cx="56" cy="66" r="3.0" fill="#ffffff" opacity="0.9" />
      <circle cx="34" cy="82" r="2.6" fill="#ffffff" opacity="0.9" />
      <!-- Mid-grey feldspar -->
      <rect x="2" y="24" width="4" height="3" fill="#8d8e8b" opacity="0.6" />
      <rect x="62" y="32" width="5" height="4" fill="#999a96" opacity="0.6" />
      <rect x="22" y="52" width="4" height="4" fill="#888985" opacity="0.6" />
      <rect x="74" y="72" width="3" height="4" fill="#90918d" opacity="0.6" />
    </pattern>

    <linearGradient id="polishGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Base Granite Stone Bed -->
  <rect width="1200" height="900" fill="#dfdedb" />
  <rect width="1200" height="900" fill="url(#quartzSpecks)" opacity="0.95" />
  <rect width="1200" height="900" filter="url(#graniteNoise)" opacity="0.45" />

  <!-- Natural Stone Depth & Architectural Sawn Edge Finish -->
  <rect width="1200" height="900" fill="url(#polishGleam)" />
  <rect x="0" y="0" width="1200" height="900" fill="none" stroke="#8c8d89" stroke-width="2" opacity="0.4" />
</svg>
