<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <filter id="limestoneGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0.9  0.2  0    0  0.18
        0.8  0.2  0    0  0.15
        0.6  0.2  0.1  0  0.10
        0    0    0    1  0" in="noise" result="coloredNoise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="0.9" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="coloredNoise" in2="light" result="stoneTex" />
    </filter>

    <linearGradient id="limestoneTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eae5d7" />
      <stop offset="35%" stop-color="#dfd9c9" />
      <stop offset="70%" stop-color="#e8e2d4" />
      <stop offset="100%" stop-color="#d8d1be" />
    </linearGradient>

    <!-- Natural Sedimentary Stratification Bands -->
    <pattern id="sedimentLayers" width="600" height="90" patternUnits="userSpaceOnUse">
      <path d="M0,25 Q150,22 300,26 T600,24" fill="none" stroke="#cfc8b6" stroke-width="3" opacity="0.65" />
      <path d="M0,55 Q180,58 360,53 T600,56" fill="none" stroke="#cec6b2" stroke-width="2.5" opacity="0.6" />
      <path d="M0,78 Q220,74 420,79 T600,76" fill="none" stroke="#d5cebc" stroke-width="4" opacity="0.5" />
      <!-- Subtle micro-fossil / calcite flecks -->
      <circle cx="85" cy="18" r="1.8" fill="#f5f0e2" opacity="0.8" />
      <circle cx="240" cy="42" r="2.2" fill="#f7f3e8" opacity="0.85" />
      <circle cx="480" cy="68" r="1.6" fill="#f4eee0" opacity="0.8" />
      <circle cx="380" cy="12" r="2.0" fill="#ded5c0" opacity="0.7" />
      <circle cx="160" cy="70" r="1.5" fill="#ded5c0" opacity="0.6" />
    </pattern>

    <linearGradient id="matteSillGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Warm Cream & Sand Buff Limestone Bed -->
  <rect width="1200" height="900" fill="url(#limestoneTone)" />
  <rect width="1200" height="900" fill="url(#sedimentLayers)" opacity="0.9" />
  <rect width="1200" height="900" filter="url(#limestoneGrain)" opacity="0.35" />
  <rect width="1200" height="900" fill="url(#matteSillGleam)" />

  <!-- Clean Sawn Architectural Edge -->
  <rect x="0" y="0" width="1200" height="900" fill="none" stroke="#c0b9a6" stroke-width="2" opacity="0.5" />
</svg>
